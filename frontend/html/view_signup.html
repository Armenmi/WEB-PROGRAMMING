<section id="signup" class="min-h-screen bg-white">
  <div
    class="mx-auto flex flex-row items-center justify-center max-w-7xl grid-cols-1 items-center gap-8 px-6 py-16 md:grid-cols-2 md:px-8">
    <!-- Brand / Illustration -->
    <div class="order-2 md:order-1">
      <div class="relative overflow-hidden rounded-3xl border border-zinc-200 bg-white p-8 shadow-sm">
        <div class="absolute inset-0 -z-10 pointer-events-none" style="background:
              radial-gradient(600px 300px at 10% -10%, rgba(239,68,68,.10), transparent 60%),
              radial-gradient(480px 260px at 110% 10%, rgba(239,68,68,.08), transparent 60%);">
        </div>

        <div class="mb-6 inline-flex items-center gap-3">
          <img src="./static/logo.png" alt="Logo" class="h-10 w-10 rounded-md shadow-sm" />
          <div>
            <p class="text-xl font-extrabold text-zinc-900">Create your account</p>
            <p class="text-sm text-zinc-600">Join for early drops, members-only colors, and perks.</p>
          </div>
        </div>

        <ul class="space-y-3 text-sm text-zinc-700">
          <li class="flex items-center gap-2"><span class="h-1.5 w-1.5 rounded-full bg-red-600"></span> Free returns on
            members' orders</li>
          <li class="flex items-center gap-2"><span class="h-1.5 w-1.5 rounded-full bg-red-600"></span> Saved sizes &
            fast checkout</li>
          <li class="flex items-center gap-2"><span class="h-1.5 w-1.5 rounded-full bg-red-600"></span> Early access to
            collabs</li>
        </ul>
      </div>
    </div>

    <!-- Sign Up Card -->
    <div class="order-1 md:order-2">
      <div
        class="mx-auto w-full max-w-md overflow-hidden rounded-3xl border border-zinc-200 bg-white p-6 shadow-sm ring-1 ring-transparent hover:ring-[rgba(239,68,68,.25)] transition">
        <h1 class="text-2xl font-extrabold tracking-tight text-zinc-900">Sign up</h1>
        <p class="mt-1 text-sm text-zinc-600">Already have an account?
          <a href="#login" class="font-semibold text-red-700 hover:underline">Log in</a>
        </p>

        <form id="registerForm" class="mt-6 space-y-4" novalidate>
          <!-- Name -->
          <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
            <div>
              <label for="first_name" class="mb-1 block text-sm font-medium text-zinc-800">First name</label>
              <input id="first_name" name="first_name" type="text" required
                class="block w-full rounded-xl border border-zinc-200 bg-white px-4 py-3 text-zinc-900 placeholder-zinc-400 outline-none focus:border-zinc-300 focus:ring-2 focus:ring-red-500/30"
                placeholder="Michael" />
            </div>
            <div>
              <label for="last_name" class="mb-1 block text-sm font-medium text-zinc-800">Last name</label>
              <input id="last_name" name="last_name" type="text" required
                class="block w-full rounded-xl border border-zinc-200 bg-white px-4 py-3 text-zinc-900 placeholder-zinc-400 outline-none focus:border-zinc-300 focus:ring-2 focus:ring-red-500/30"
                placeholder="Jordan" />
            </div>
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="mb-1 block text-sm font-medium text-zinc-800">Email</label>
            <input id="email" name="email" type="email" required
              class="block w-full rounded-xl border border-zinc-200 bg-white px-4 py-3 text-zinc-900 placeholder-zinc-400 outline-none focus:border-zinc-300 focus:ring-2 focus:ring-red-500/30"
              placeholder="you@example.com" />
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="mb-1 block text-sm font-medium text-zinc-800">Password</label>
            <div class="relative">
              <input id="password" name="password" type="password" required minlength="8"
                class="block w-full rounded-xl border border-zinc-200 bg-white px-4 py-3 pr-12 text-zinc-900 placeholder-zinc-400 outline-none focus:border-zinc-300 focus:ring-2 focus:ring-red-500/30"
                placeholder="At least 8 characters" />
              <button type="button" id="togglePw"
                class="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg border border-zinc-200 bg-white px-2 py-1 text-xs font-semibold text-zinc-800 hover:bg-zinc-50">
                Show
              </button>
            </div>
          </div>



          <!-- Submit -->
          <button type="submit"
            class="inline-flex w-full items-center justify-center rounded-2xl bg-red-600 px-6 py-3.5 text-sm font-semibold text-white shadow-sm ring-1 ring-red-700/10 transition hover:bg-red-700 active:scale-[0.98]">
            Create account
          </button>




          <!-- Or divider -->
          <div class="flex items-center gap-3">
            <div class="h-px w-full bg-zinc-200"></div>
            <span class="text-xs font-medium text-zinc-500">or</span>
            <div class="h-px w-full bg-zinc-200"></div>
          </div>

          <!-- Socials -->
          <div class="grid grid-cols-2 gap-3">
            <button type="button"
              class="rounded-xl border border-zinc-200 bg-white px-4 py-2.5 text-sm font-semibold text-zinc-800 hover:border-zinc-300 hover:shadow-sm">
              Sign up with Google
            </button>
            <button type="button"
              class="rounded-xl border border-zinc-200 bg-white px-4 py-2.5 text-sm font-semibold text-zinc-800 hover:border-zinc-300 hover:shadow-sm">
              Sign up with Apple
            </button>
          </div>
        </form>

        <!-- Helper text -->
        <p class="mt-4 text-xs text-zinc-500">
          We'll send you product updates and exclusive launches. You can opt out anytime.
        </p>
      </div>
    </div>
  </div>
</section>

<script>
  // Password toggle
  const pwInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePw');

  toggleBtn.addEventListener('click', () => {
    const isPassword = pwInput.type === 'password';
    pwInput.type = isPassword ? 'text' : 'password';
    toggleBtn.textContent = isPassword ? 'Hide' : 'Show';
  });

  // Your AuthService logic will handle the rest
  AuthService.register();
</script>
