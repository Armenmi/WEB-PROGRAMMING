<section class="min-h-screen bg-white flex items-center justify-center px-6">
    <div class="text-center">
        <!-- Error illustration area -->
        <div class="relative mb-8">
            <div class="absolute inset-0 -z-10 blur-3xl opacity-30"
                style="background: radial-gradient(circle at center, rgba(239,68,68,0.4), transparent 70%);"></div>

            <h1 class="text-[180px] font-extrabold text-zinc-900 leading-none tracking-tighter">
                404
            </h1>
        </div>

        <!-- Message -->
        <div class="max-w-md mx-auto space-y-4">
            <h2 class="text-3xl font-bold text-zinc-900">Oops! Page not found</h2>
            <p class="text-zinc-600">
                The page you're looking for doesn't exist or has been moved.
            </p>

            <!-- Actions -->
            <div class="flex flex-col sm:flex-row gap-3 justify-center pt-6">
                <a href="#view_main"
                    class="inline-flex items-center justify-center rounded-2xl bg-red-600 px-6 py-3 text-sm font-semibold text-white shadow-sm ring-1 ring-red-700/10 transition hover:bg-red-700 active:scale-[0.98]">
                    Go home
                </a>
                <button onclick="window.history.back()"
                    class="inline-flex items-center justify-center rounded-2xl border border-zinc-200 bg-white px-6 py-3 text-sm font-semibold text-zinc-800 transition hover:border-zinc-300 hover:shadow-sm active:scale-[0.98]">
                    Go back
                </button>
            </div>
        </div>

        <!-- Decorative elements -->
        <div class="mt-12 flex items-center justify-center gap-2 text-sm text-zinc-500">
            <span class="h-1 w-1 rounded-full bg-red-600"></span>
            <span>Error code: 404</span>
            <span class="h-1 w-1 rounded-full bg-red-600"></span>
        </div>
    </div>
</section>
