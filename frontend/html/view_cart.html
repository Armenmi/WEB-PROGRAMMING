<section class="min-h-screen bg-white">
    <div class="mx-auto max-w-7xl px-6 py-10 md:px-8">
        <!-- Header -->
        <h1 class="mb-8 text-3xl font-extrabold text-zinc-900">Your Cart</h1>

        <div class="grid grid-cols-1 gap-10 lg:grid-cols-3">
            <!-- Cart Items -->
            <div class="lg:col-span-2 flex flex-col gap-6" id="cart-div">
                <!-- Sample Cart Item -->

                <!-- Duplicate another item for demo -->

            </div>

            <!-- Order Summary -->
            <aside class="lg:sticky lg:top-24">
                <div class="rounded-3xl border border-zinc-200 bg-white p-6 shadow-sm">
                    <h2 class="mb-4 text-xl font-extrabold text-zinc-900">Order Summary</h2>
                    <div class="flex justify-between text-sm text-zinc-600">
                        <span>Subtotal</span>
                        <span id="cart-subtotal">$0.00</span>
                    </div>
                    <div class="mt-2 flex justify-between text-sm text-zinc-600">
                        <span>Shipping</span>
                        <span>Free</span>
                    </div>
                    <div class="mt-2 flex justify-between text-sm text-zinc-600">
                        <span>Taxes</span>
                        <span id="cart-tax">$0.00</span>
                    </div>
                    <div
                        class="mt-4 flex justify-between border-t border-zinc-200 pt-4 text-lg font-semibold text-zinc-900">
                        <span>Total</span>
                        <span id="cart-total">$0.00</span>
                    </div>
                    <button onclick="OrderService.checkout()"
                        class="mt-6 w-full rounded-2xl bg-red-600 px-6 py-3 text-white font-semibold shadow-sm transition hover:bg-red-700 active:scale-[0.98]">
                        Checkout
                    </button>
                    <p class="mt-3 text-center text-sm text-zinc-500">Secure checkout with all major cards</p>
                </div>
            </aside>
        </div>
    </div>
</section>

<script>
    // Quantity buttons
    document.querySelectorAll('#cartview button').forEach(btn => {
        if (btn.textContent.trim() === '−') {
            btn.addEventListener('click', e => {
                const input = e.target.nextElementSibling;
                input.value = Math.max(1, parseInt(input.value) - 1);
            });
        } else if (btn.textContent.trim() === '+') {
            btn.addEventListener('click', e => {
                const input = e.target.previousElementSibling;
                input.value = parseInt(input.value) + 1;
            });
        }
    });

    // Remove item
    document.querySelectorAll('#cartview button').forEach(btn => {
        if (btn.textContent.trim() === '×') {
            btn.addEventListener('click', e => {
                const item = e.target.closest('div.flex.flex-col');
                if (item) item.remove();
            });
        }
    });
</script>
